# .github/workflows/deploy.yml
name: Build & Deploy (gh-pages branch)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # нужно peaceiris, чтобы пушить ветку gh-pages

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install pygbag
        run: pip install pygbag

      - name: Build game (WASM)
        run: pygbag --build main.py

      - name: Assemble site
        run: |
          mkdir -p site
          if [ -f index.html ]; then
            mkdir -p site/game
            cp -r build/web/* site/game/
            cp index.html site/index.html
          else
            cp -r build/web/* site/
          fi

      - name: Push site to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          publish_branch: gh-pages
          force: true

concurrency:
  group: pages
  cancel-in-progress: true